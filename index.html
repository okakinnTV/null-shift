const templates=[
{type:'decode',name:'暗号ファイルを復号',app:'cipher',symbol:'⌘',base:5.4,cpu:40,ram:3,credits:100,intel:1,detail:'暗号化された通信ログを解析し、復号キーを特定せよ。'},

{type:'trace',name:'発信源を逆探知',app:'trace',symbol:'⌁',base:8.8,cpu:36,ram:3,credits:175,intel:1,detail:'断片化された信号を再構成し、発信源を追跡せよ。'},
{type:'ghost',name:'アクセス履歴を偽装',app:'ghost',symbol:'◇',base:10.6,cpu:54,ram:4,credits:210,intel:1,detail:'監視記録を書き換え、依頼人の足取りを隠蔽せよ。'},

];
const upgradeDefs=[
{id:'cpu',name:'NEURAL PROCESSOR',desc:'最大CPU容量 +25 / 解析速度アップ',icon:'◈',base:230},
{id:'ram',name:'QUANTUM MEMORY',desc:'メモリ容量 +2GB / 並列処理に有利',icon:'▦',base:190},

];
const $=id=>document.getElementById(id);const safe=(n,min,max)=>Math.max(min,Math.min(max,n));const fmt=n=>{let x=Math.max(0,Math.ceil(n));return`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`};const sec=n=>`${Math.max(0,n).toFixed(1)}s`;
const readSave=()=>{try{const d=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');return{wallet:Math.max(0,Number(d.wallet)||0),stage:safe(Number(d.stage)||1,1,1000),best:Math.max(0,Number(d.best)||0),runs:Math.max(0,Number(d.runs)||0),wins:Math.max(0,Number(d.wins)||0),sound:d.sound!==false,upgrades:Object.fromEntries(['cpu','ram','ssd','shield'].map(k=>[k,safe(Number(d.upgrades?.[k])||0,0,4)]))}}catch(e){return{wallet:0,stage:1,best:0,runs:0,wins:0,sound:true,upgrades:{cpu:0,ram:0,ssd:0,shield:0}}}};

const state={status:'boot',remaining:SHIFT_SECONDS,elapsed:0,intel:0,score:0,roundCredits:0,integrity:100,orders:[],running:[],installed:new Set(['cipher','extract','guard']),attack:null,nextAttack:25,jobCounter:0,orderCounter:0,breaches:0,blocked:0,toastTimer:null,modal:null,helpReturn:'boot',lastTick:0,screenVersion:0,pausingFromHidden:false,target:8,pattern:null,folderNew:{},nextOrderAt:0};
const maxCPU=()=>110+25*save.upgrades.cpu;const maxRAM=()=>8+2*save.upgrades.ram;const maxStorage=()=>13+5*save.upgrades.ssd;const maxIntegrity=()=>100+20*save.upgrades.shield;const missionTarget=()=>Math.min(8+Math.floor((save.stage-1)/2),14);const cpuUsed=()=>state.running.reduce((n,j)=>n+j.cpu,0);const ramUsed=()=>state.running.reduce((n,j)=>n+j.ram,0);const storageUsed=()=>software.reduce((n,p)=>n+(state.installed.has(p.id)?p.size:0),0)+state.running.filter(j=>j.action==='install').reduce((n,j)=>n+software.find(p=>p.id===j.program).size,0);
function getSoft(id){return software.find(x=>x.id===id)};const earnCost=d=>Math.floor(d.base*(1+.68*save.upgrades[d.id]));

const folderNames={decode:'復号',extract:'抽出',trace:'逆探知',ghost:'偽装',restore:'復元'};
function enqueueOrder(forceType){if(state.orders.length>=MAX_INBOX)return false;const order=makeOrder(forceType);state.orders.push(order);state.folderNew[order.type]=(state.folderNew[order.type]||0)+1;return true}
function resetRound(){state.target=missionTarget();state.remaining=SHIFT_SECONDS;state.elapsed=0;state.intel=0;state.score=0;state.roundCredits=0;state.integrity=maxIntegrity();state.orders=[];state.running=[];state.folderNew={};state.nextOrderAt=6;state.installed=new Set(['cipher','extract','guard']);state.attack=null;state.pattern=null;state.nextAttack=23+Math.random()*7;state.orderCounter=0;state.jobCounter=0;state.breaches=0;state.blocked=0;state.modal=null;state.pausingFromHidden=false;['decode','extract','restore','trace'].forEach(enqueueOrder)}

<div class="systemline"><div class="resource"><b>CPU</b>　<span id="res-cpu">${cpuUsed()}/${maxCPU()}</span><div class="bar"><div id="bar-cpu" class="bar-fill" style="width:${cpuUsed()/maxCPU()*100}%"></div></div></div><div class="resource"><b>RAM</b>　<span id="res-ram">${ramUsed()}/${maxRAM()}</span><div class="bar"><div id="bar-ram" class="bar-fill" style="width:${ramUsed()/maxRAM()*100}%"></div></div></div><div class="resource"><b>SSD</b>　<span id="res-ssd">${storageUsed()}/${maxStorage()}</span><div class="bar"><div id="bar-ssd" class="bar-fill" style="width:${storageUsed()/maxStorage()*100}%"></div></div></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 1px 0"><span class="small-text" id="hud-score">SCORE ${state.score} / BEST ${save.best}</span><button style="border:0;background:none;color:#82b6c8;font-size:10px;padding:8px" data-action="pause">${playing?'Ⅱ 一時停止':'◈ START'}</button></div>`;
$('dock').innerHTML=`<button class="nav-btn" data-action="panel" data-id="help"><span class="nav-glyph">☷</span><span class="nav-name">操作説明</span></button><button class="nav-btn" data-action="panel" data-id="software"><span class="nav-glyph">▦</span><span class="nav-name">ソフト管理</span></button><button class="nav-btn${attacking?' warn':''}" data-action="panel" data-id="defense"><span class="nav-glyph">⬡</span><span class="nav-name">防衛${attacking?' !':''}</span></button><button class="nav-btn" data-action="open-shop"><span class="nav-glyph">◈</span><span class="nav-name">機材強化</span></button>`;
renderCover()}
function renderCover(){const cover=$('cover-root');if(state.status==='playing'){cover.innerHTML='';return}if(state.status==='boot'){cover.innerHTML=`<div class="cover"><div class="cover-content"><span class="cover-symbol">⬡</span><div class="cover-kicker">INITIALIZING OPERATOR SYSTEM</div><h1 class="cover-title">NULL<span class="cyan">//</span>SHIFT</h1><div class="cover-kicker" style="font-size:9px;color:#83abc1">V2.1 // THREE MINUTES TO CONTROL THE CHAOS</div><p class="cover-desc">解析を走らせ、ソフトを入れ替え、敵の侵入を迎撃。<br>180秒の間にどれだけ仕事をさばける？</p><div class="cover-stats"><div class="cover-stat"><b>03:00</b><small>1プレイ</small></div><div class="cover-stat"><b>OP-${String(save.stage).padStart(3,'0')}</b><small>作戦レベル</small></div><div class="cover-stat"><b>${save.wallet} CR</b><small>所持資金</small></div></div><button class="action-btn cover-btn" data-action="start">◈　ミッション開始</button><button class="action-btn cover-btn secondary" data-action="panel" data-id="shop">機材ショップ</button><button class="action-btn cover-btn secondary" data-action="panel" data-id="help">遊び方を見る</button><div class="cover-foot">HEADPHONES RECOMMENDED · TOUCH CONTROL READY<br>© NULL//SHIFT PROTOTYPE 2.0</div></div></div>`;return}if(state.status==='paused'){cover.innerHTML=`<div class="cover pause-cover"><div class="cover-content"><span class="cover-symbol" style="font-size:60px">Ⅱ</span><div class="cover-kicker">SIMULATION SUSPENDED</div><h2 class="cover-title" style="font-size:30px">一時停止中</h2><p class="cover-desc">残り時間 ${fmt(state.remaining)}<br>準備ができたら再開しよう。</p><button class="action-btn cover-btn" data-action="resume">▶　ミッション再開</button><button class="action-btn secondary cover-btn" data-action="panel" data-id="help">遊び方・設定</button></div></div>`;return}if(state.status==='result'){const win=state.intel>=state.target&&state.integrity>0;cover.innerHTML=`<div class="cover"><div class="cover-content"><span class="cover-symbol" style="font-size:68px;color:${win?'var(--green)':'var(--danger)'}">${win?'◇':'⚠'}</span><div class="cover-kicker">OPERATION REPORT / ${win?'COMPLETE':'FAILED'}</div><h2 class="cover-title ${win?'result-title':'result-fail'}" style="font-size:29px">${win?'MISSION CLEAR':'MISSION FAILED'}</h2><div class="cover-desc" style="margin-bottom:8px">${win?'目標達成！次の依頼が待っている。':'目標未達成。装備を見直して再挑戦！'}</div><div class="result-score">${state.score.toLocaleString('ja-JP')}</div><div class="small-text">TOTAL SCORE</div><div class="cover-stats" style="margin:20px 0 10px"><div class="cover-stat"><b>${state.intel}/${state.target}</b><small>完了依頼</small></div><div class="cover-stat"><b>${state.blocked}</b><small>敵襲迎撃</small></div><div class="cover-stat"><b>${Math.round(state.integrity/maxIntegrity()*100)}%</b><small>残存耐久値</small></div></div><div class="result-reward">+${state.roundCredits} CR</div><div class="small-text" style="margin:6px 0 19px">累計所持 ${save.wallet} CR</div><button class="action-btn cover-btn" data-action="start">◈　${win?'次の作戦へ':'もう一度挑戦'}</button><button class="action-btn secondary cover-btn" data-action="panel" data-id="shop">機材を強化する</button><div class="cover-foot">BEST SCORE ${save.best} · COMPLETED ${save.wins} OPERATIONS</div></div></div>`}}
function handle(a,id){switch(a){case'start':startRound();break;case'order':showPanel('order',id);break;case'folder':showPanel('folder',id);break;case'panel':showPanel(id);break;case'close-panel':case'close-overlay':closePanel();break;case'start-order':startOrder(id);break;case'skip-order':skipOrder(id);break;case'install':installProgram(id);break;case'uninstall':uninstallProgram(id);break;case'defend':defend('defend');break;case'counter':defend('counter');break;case'emergency':emergency();break;case'reveal-lock':lockReveal();break;case'open-shop':openShop();break;case'upgrade':buyUpgrade(id);break;case'pause':if(state.status==='playing'){state.status='paused';closePanel();render()}break;case'resume':if(state.status==='paused'){state.status='playing';state.lastTick=performance.now();closePanel();render()}break;case'quit':if(state.status==='playing'){finishRound()}else{closePanel()}break;case'sound':save.sound=!save.sound;persist();toast(`サウンド ${save.sound?'ON':'OFF'}`);renderPanel();break}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='close-overlay'&&e.target.closest('.holo'))return;e.preventDefault();handle(el.dataset.action,el.dataset.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closePanel()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.status==='playing'){state.status='paused';state.pausingFromHidden=true;render()}});
function updateLive(){if(state.status!=='playing')return;const txt=(id,val)=>{const e=$(id);if(e)e.textContent=val};const hpPct=state.integrity/maxIntegrity()*100;txt('hud-clock',fmt(state.remaining));txt('inbox-next',state.orders.length>=MAX_INBOX?'FULL':sec(state.nextOrderAt-state.elapsed));if($('hud-clock'))$('hud-clock').classList.toggle('danger',state.remaining<30);const h=$('hud-health');if(h){h.innerHTML=`${Math.round(hpPct)}<span style="font-size:12px">%</span>`;h.classList.toggle('danger',hpPct<35)}txt('hud-credits',String(state.roundCredits));txt('hud-intel-target',String(state.intel));const int=$('hud-intel');if(int)int.innerHTML=`${String(state.intel).padStart(2,'0')}<span style="font-size:14px;color:#6999ac"> / ${String(state.target).padStart(2,'0')}</span>`;if($('hud-progress'))$('hud-progress').style.width=`${safe(state.intel/state.target*100,0,100)}%`;txt('hud-cpuPct',Math.round(cpuUsed()/maxCPU()*100)+'%');txt('hud-ramData',`${ramUsed()} / ${maxRAM()}GB`);txt('hud-attack-time',state.attack?sec(state.attack.remaining):'');txt('attack-countdown',state.attack?sec(state.attack.remaining):'');updateLockUI();txt('res-cpu',`${cpuUsed()}/${maxCPU()}`);txt('res-ram',`${ramUsed()}/${maxRAM()}`);txt('res-ssd',`${storageUsed()}/${maxStorage()}`);txt('hud-score',`SCORE ${state.score} / BEST ${save.best}`);for(const j of state.running){const el=document.querySelector(`[data-job-clock="${j.id}"]`),bar=document.querySelector(`[data-job-progress="${j.id}"]`);if(el)el.textContent=sec(j.duration-j.elapsed);if(bar)bar.style.width=`${safe(j.elapsed/j.duration*100,0,100)}%`}}
let paint=0;function frame(now){if(state.status==='playing'){const dt=Math.min((now-state.lastTick)/1000,.15);if(Number.isFinite(dt)&&dt>0)stepGame(dt);state.lastTick=now;if(now-paint>110){updateLive();paint=now}}else{state.lastTick=now}requestAnimationFrame(frame)}
render();requestAnimationFrame(frame);
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
if(new URLSearchParams(location.search).has('debug')){window.__gameDebug={get:()=>({status:state.status,remaining:state.remaining,intel:state.intel,score:state.score,wallet:save.wallet,orders:state.orders,folderNew:state.folderNew,nextOrderAt:state.nextOrderAt,running:state.running,installed:[...state.installed],attack:state.attack,integrity:state.integrity,storageUsed:storageUsed(),maxStorage:maxStorage(),cpu:cpuUsed(),ram:ramUsed(),stage:save.stage}),step:stepGame,attack:triggerAttack,finish:finishRound,reset:()=>{save.wallet=0;save.stage=1;save.upgrades={cpu:0,ram:0,ssd:0,shield:0};persist();state.status='boot';resetRound();render()},start:startRound};}
})();
</script>
</body>
